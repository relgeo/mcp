name: MCP CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: mcp

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: dart analyze

      - name: Unit tests
        run: dart test

      - name: Protocol conformance
        run: dart run tool/run_transport_conformance.dart

  notify-workspace:
    name: Notify workspace after validated main CI
    needs: [quality]
    if: >-
      ${{
        needs.quality.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch validated submodule revision to workspace
        uses: actions/github-script@v7
        env:
          WORKSPACE_DISPATCH_TOKEN: ${{ secrets.WORKSPACE_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.WORKSPACE_DISPATCH_TOKEN || github.token }}
          script: |
            if (!process.env.WORKSPACE_DISPATCH_TOKEN) {
              core.setFailed('WORKSPACE_DISPATCH_TOKEN is not configured');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'relgeo',
              repo: 'workspace',
              event_type: 'submodule_ci_succeeded',
              client_payload: {
                submodule: 'mcp',
                repository: 'relgeo/mcp',
                path: 'mcp',
                sha: context.sha,
                run_id: String(context.runId),
                run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                workflow: '.github/workflows/mcp-ci.yml',
                branch: context.ref,
              },
            });
